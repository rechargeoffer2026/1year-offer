<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mobile Recharge</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-J8CJT7PL1X"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-J8CJT7PL1X');</script>
<!-- Keep your existing CDN loads -->
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{width:100%;min-height:100%;overflow-x:hidden}
  body{margin:0;background:linear-gradient(180deg,#ece7f6 0%,#eef0f4 40%);font-family:'Manrope',-apple-system,sans-serif;min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:flex-start;padding:24px 16px}
  .card{width:100%;max-width:420px;min-height:100vh;min-height:100dvh;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 24px 60px -20px rgba(95,37,159,.28),0 2px 8px rgba(16,24,40,.04);border:1px solid rgba(95,37,159,.06)}
  .card > :first-child{padding-top:calc(16px + env(safe-area-inset-top)) !important}
  .card > :last-child{padding-bottom:calc(24px + env(safe-area-inset-bottom)) !important}
  button,input{font:inherit;touch-action:manipulation}
  input{font-size:16px !important}
  @media (max-width:640px){
    body{padding:0;background:#fff}
    .card{max-width:100%;min-height:100vh;min-height:100dvh;border-radius:0;border:0;box-shadow:none}
  }
  .grad{background:linear-gradient(120deg,#5f259f 0%,#7b34c9 100%)}
  .btn-primary{background:linear-gradient(120deg,#5f259f,#7b34c9);box-shadow:0 14px 26px -12px rgba(95,37,159,.7)}
  a{color:#5f259f;text-decoration:none}a:hover{color:#4a1c7d}
</style>
</head>
<body>
  <div class="card">
    <!-- Header -->
    <div class="grad" style="display:flex;align-items:center;gap:12px;padding:16px 12px;min-width:0">
      <button aria-hidden="true" tabindex="-1" style="display:none;width:40px;height:40px;border:none;border-radius:12px;background:rgba(255,255,255,.14);cursor:pointer;color:#fff"><i class="fa-solid fa-bars"></i></button>
      <div style="display:flex;align-items:center;gap:8px;flex:0 0 auto;white-space:nowrap">
        <span style="display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#fff;color:#5f259f;font-weight:800;font-size:16px">P</span>
        <span style="color:#fff;font-weight:800;font-size:18px">PhonePe</span>
      </div>
      <div style="flex:0 0 150px;width:150px;display:flex;align-items:center;gap:8px;margin-left:auto;padding:0 12px;height:38px;border-radius:12px;background:rgba(255,255,255,.16);min-width:0">
        <i class="fa-solid fa-magnifying-glass" style="color:rgba(255,255,255,.85);font-size:12px"></i>
        <span style="color:rgba(255,255,255,.85);font-size:13px">Search…</span>
      </div>
      <button style="display:grid;place-items:center;width:40px;height:40px;border:none;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;cursor:pointer"><i class="fa-solid fa-question"></i></button>
    </div>

    <!-- Body -->
    <div style="padding:30px 22px 24px">
      <h1 style="margin:0;text-align:center;font-size:30px;font-weight:800;color:#1b1230;letter-spacing:-.5px">Mobile Recharge</h1>
      <p style="margin:10px auto 0;text-align:center;font-size:14px;line-height:1.5;color:#6b6480;max-width:300px">Enter your mobile number to explore active plans and exclusive offers.</p>

      <!-- Prepaid / Postpaid -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:22px auto 0;padding:4px;background:#f2eefb;border-radius:14px;max-width:300px">
        <button id="tab-prepaid" onclick="setType('prepaid')" class="btn-primary" style="border:none;border-radius:11px;padding:11px 0;font-family:inherit;font-weight:700;font-size:14px;color:#fff;cursor:pointer">Prepaid</button>
        <button id="tab-postpaid" onclick="setType('postpaid')" style="border:none;border-radius:11px;padding:11px 0;font-family:inherit;font-weight:700;font-size:14px;color:#5f259f;background:transparent;cursor:pointer">Postpaid</button>
      </div>

      <!-- Operators -->
      <div id="operators" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:26px"></div>

      <!-- Mobile number -->
      <label style="display:block;margin:26px 0 8px;font-size:14px;font-weight:700;color:#1b1230">Your Mobile Number</label>
      <div id="inputWrap" style="display:flex;align-items:center;padding:0 16px;height:56px;border-radius:16px;background:#fbfafc;border:1.5px solid #e9e6f0;transition:all .15s">
        <span style="font-size:15px;font-weight:700;color:#6b6480;padding-right:10px;border-right:1px solid #e6e2f0">+91</span>
        <input id="mobile" type="tel" inputmode="numeric" maxlength="10" placeholder="Enter mobile number" oninput="onNumberInput()" style="flex:1;border:none;outline:none;background:transparent;font-family:inherit;font-size:16px;font-weight:600;color:#1b1230;padding-left:12px">
      </div>

      <button id="proceedBtn" onclick="proceed()" style="width:100%;margin-top:18px;border:none;border-radius:16px;padding:17px 0;font-family:inherit;font-weight:800;font-size:16px;color:#fff;background:#c9c2d8;cursor:not-allowed;letter-spacing:.2px;transition:all .15s">Proceed to Recharge</button>
      <div id="hint" style="display:none;margin-top:8px;text-align:center;font-size:12px;font-weight:600;color:#e0417a">Enter a valid 10-digit mobile number</div>

      <!-- Assured reward -->
      <div style="margin-top:22px;display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:linear-gradient(120deg,#f6f1fd,#f1ecfb);border:1px solid rgba(95,37,159,.1)">
        <div style="flex:1">
          <span style="display:inline-block;font-size:10px;font-weight:800;letter-spacing:.6px;color:#fff;background:#e0417a;padding:4px 9px;border-radius:6px">ASSURED REWARD</span>
          <div style="margin-top:9px;font-size:15px;font-weight:800;color:#1b1230">Get Extra 90% Discount On Plans</div>
          <div style="margin-top:3px;font-size:12.5px;color:#6b6480">Valid on instant online payment processing.</div>
        </div>
        <div style="display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:#fff;box-shadow:0 6px 14px -8px rgba(95,37,159,.5)"><i class="fa-solid fa-gift" style="color:#5f259f;font-size:20px"></i></div>
      </div>

      <!-- Footer -->
      <div style="margin-top:22px;padding-top:18px;border-top:1px solid #f0eef4;text-align:center">
        <div style="display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:#2e9e6b"><i class="fa-solid fa-shield-halved"></i>Secure 256-bit Encrypted Connection</div>
        <div style="margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:1px;color:#9a93ab">POWERED BY
          <span style="display:inline-flex;align-items:center;gap:5px;color:#5f259f"><span style="display:grid;place-items:center;width:16px;height:16px;border-radius:5px;background:#5f259f;color:#fff;font-size:10px;font-weight:800">P</span>PHONEPE</span>
        </div>
      </div>
    </div>
  </div>

<script>
/* ---- UI state (replace with your existing logic where noted) ---- */
var OPERATORS = [
  { name:'Jio',    mark:'Jio',    bg:'#e21b22', fg:'#fff' },
  { name:'Airtel', mark:'airtel', bg:'#fff',    fg:'#e40000' },
  { name:'Vi',     mark:'Vi',     bg:'#e60000', fg:'#fff' },
  { name:'BSNL',   mark:'BSNL',   bg:'#fff',    fg:'#1a6bb0' }
];
var selectedOperator = localStorage.getItem('recharge_operator') || 'Jio';
var connType = 'prepaid';

function renderOperators(){
  var host = document.getElementById('operators');
  host.innerHTML = OPERATORS.map(function(o){
    var active = o.name === selectedOperator;
    return '<button onclick="selectOperator(\''+o.name+'\')" style="position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px 10px;border-radius:16px;cursor:pointer;font-family:inherit;background:'+(active?'#f6f1fd':'#fbfafc')+';border:1.5px solid '+(active?'#5f259f':'#ececf2')+';box-shadow:'+(active?'0 8px 18px -10px rgba(95,37,159,.45)':'none')+'">'
      + '<span style="display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:'+o.bg+';color:'+o.fg+';font-weight:800;font-size:'+(o.mark.length>3?12:15)+'px;border:1px solid rgba(0,0,0,.06)">'+o.mark+'</span>'
      + '<span style="font-size:12px;font-weight:700;color:'+(active?'#5f259f':'#4a4560')+'">'+o.name+'</span>'
      + '<span style="position:absolute;top:8px;right:8px;width:14px;height:14px;border-radius:50%;border:2px solid '+(active?'#5f259f':'#d5d1e0')+';background:'+(active?'radial-gradient(circle,#5f259f 45%,#fff 46%)':'#fff')+'"></span>'
      + '</button>';
  }).join('');
}
function selectOperator(name){ selectedOperator = name; renderOperators(); }
function setType(t){
  connType = t;
  var pre=document.getElementById('tab-prepaid'), post=document.getElementById('tab-postpaid');
  if(t==='prepaid'){ pre.className='btn-primary'; pre.style.color='#fff'; post.className=''; post.style.color='#5f259f'; post.style.background='transparent'; }
  else { post.className='btn-primary'; post.style.color='#fff'; pre.className=''; pre.style.color='#5f259f'; pre.style.background='transparent'; }
}
function onNumberInput(){
  var el=document.getElementById('mobile');
  el.value = el.value.replace(/[^0-9]/g,'');
  var ok = el.value.length===10 && ['6','7','8','9'].includes(el.value.charAt(0));
  var btn=document.getElementById('proceedBtn');
  if(ok){ btn.style.background='linear-gradient(120deg,#5f259f,#7b34c9)'; btn.style.boxShadow='0 14px 26px -12px rgba(95,37,159,.7)'; btn.style.cursor='pointer'; document.getElementById('hint').style.display='none'; }
  else { btn.style.background='#c9c2d8'; btn.style.boxShadow='none'; btn.style.cursor='not-allowed'; }
}
document.getElementById('mobile').addEventListener('focus',function(){ document.getElementById('inputWrap').style.border='1.5px solid #5f259f'; document.getElementById('inputWrap').style.boxShadow='0 0 0 4px rgba(95,37,159,.1)'; });
document.getElementById('mobile').addEventListener('blur',function(){ document.getElementById('inputWrap').style.border='1.5px solid #e9e6f0'; document.getElementById('inputWrap').style.boxShadow='none'; });

/* ---- Navigation: keep your own save/redirect logic here ---- */
function proceed(){
  var num = document.getElementById('mobile').value;
  if(num.length!==10 || !['6','7','8','9'].includes(num.charAt(0))){ document.getElementById('hint').style.display='block'; return; }
  localStorage.setItem('recharge_mobile', num);
  localStorage.setItem('recharge_operator', selectedOperator);
  window.location.href = 'plans.html';
}

/* Existing handler names kept for compatibility with the original page. */
function filterInputCharacters(element){ onNumberInput(); }
function syncUIVisualState(currentNodeKey){ selectOperator(currentNodeKey); }
function processNodeValidation(){ proceed(); }

renderOperators();
</script>
</body>
</html>
